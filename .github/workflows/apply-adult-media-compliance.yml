name: Apply Adult Studio Media Compliance

on:
  push:
    branches:
      - feature/adult-entry-and-landing-overhaul
    paths:
      - .github/workflows/apply-adult-media-compliance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adult-entry-and-landing-overhaul
          fetch-depth: 0
      - run: python scripts/apply-adult-media-compliance.py
      - run: |
          git rm scripts/apply-adult-media-compliance.py
          git rm .github/workflows/apply-adult-media-compliance.yml
      - run: |
          git config user.name "Virelle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Adult Studio disclosure moderation and provenance"
          git push origin HEAD:feature/adult-entry-and-landing-overhaul
