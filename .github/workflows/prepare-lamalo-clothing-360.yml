name: Prepare Lamalo Clothing 360

on:
  push:
    branches:
      - lamalo-clothing-pipeline
    paths:
      - "scripts/lamalo360/**"
      - ".github/workflows/prepare-lamalo-clothing-360.yml"
      - "server/_core/lamaloMasterReferences.ts"
      - "client/src/components/Lamalo360Viewer.tsx"
      - "drizzle/0044_lamalo_true_360_assets.sql"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/lamalo360/**"
      - ".github/workflows/prepare-lamalo-clothing-360.yml"
      - "server/_core/lamaloMasterReferences.ts"
      - "client/src/components/Lamalo360Viewer.tsx"
      - "drizzle/0044_lamalo_true_360_assets.sql"

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lamalo-clothing-pipeline
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install current dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply codebase integration
        run: node scripts/lamalo360/apply-codebase-integration.mjs

      - name: Add official glTF validator
        run: pnpm add --save-dev gltf-validator

      - name: Compile clothing-only production manifest
        run: node scripts/lamalo360/catalogue.mjs

      - name: Syntax-check production scripts
        run: |
          node --check scripts/lamalo360/catalogue.mjs
          node --check scripts/lamalo360/generate-source-reference.mjs
          node --check scripts/lamalo360/review-source-reference.mjs
          node --check scripts/lamalo360/generate-geometry.mjs
          node --check scripts/lamalo360/generate-pattern-texture.mjs
          node --check scripts/lamalo360/review-turntable.mjs
          node --check scripts/lamalo360/validate-pack.mjs
          node --check scripts/lamalo360/run-master.mjs
          node --check scripts/lamalo360/run-batch.mjs
          python3 -m py_compile scripts/lamalo360/blender/render_turntable.py

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Integrate Lamalo clothing true 360 pipeline"
            git push origin HEAD:lamalo-clothing-pipeline
          fi

      - name: TypeScript check
        id: typecheck
        continue-on-error: true
        run: pnpm check 2>&1 | tee /tmp/lamalo-typecheck.log

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lamalo-360-typecheck
          path: /tmp/lamalo-typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail on TypeScript errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Unit and integration tests
        id: tests
        continue-on-error: true
        run: pnpm test 2>&1 | tee /tmp/lamalo-tests.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lamalo-360-tests
          path: /tmp/lamalo-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail on test errors
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Production build
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_ID: ci-stub
          VITE_SENTRY_DSN: ""
