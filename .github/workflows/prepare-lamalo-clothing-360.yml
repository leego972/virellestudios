name: Prepare Lamalo Clothing 360

on:
  push:
    branches:
      - lamalo-clothing-pipeline
    paths:
      - "scripts/lamalo360/**"
      - ".github/workflows/prepare-lamalo-clothing-360.yml"
      - "server/_core/lamaloMasterReferences.ts"
      - "client/src/components/Lamalo360Viewer.tsx"
      - "drizzle/0044_lamalo_true_360_assets.sql"

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lamalo-clothing-pipeline
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install current dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply codebase integration
        run: node scripts/lamalo360/apply-codebase-integration.mjs

      - name: Add official glTF validator
        run: pnpm add --save-dev gltf-validator@2.0.0-dev.3.10

      - name: Compile clothing-only production manifest
        run: node scripts/lamalo360/catalogue.mjs

      - name: Syntax-check production scripts
        run: |
          node --check scripts/lamalo360/catalogue.mjs
          node --check scripts/lamalo360/generate-source-reference.mjs
          node --check scripts/lamalo360/review-source-reference.mjs
          node --check scripts/lamalo360/generate-geometry.mjs
          node --check scripts/lamalo360/generate-pattern-texture.mjs
          node --check scripts/lamalo360/review-turntable.mjs
          node --check scripts/lamalo360/validate-pack.mjs
          node --check scripts/lamalo360/run-master.mjs
          node --check scripts/lamalo360/run-batch.mjs
          python3 -m py_compile scripts/lamalo360/blender/render_turntable.py

      - name: TypeScript check
        run: pnpm check

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_ID: ci-stub
          VITE_SENTRY_DSN: ""

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Lamalo clothing true 360 pipeline"
          git push origin HEAD:lamalo-clothing-pipeline
