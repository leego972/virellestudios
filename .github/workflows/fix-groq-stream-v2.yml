name: Groq stream repair v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-groq-stream-v2.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch streaming provider
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/_core/llm.ts')
          text = p.read_text()
          marker = 'export async function invokeLLMStream'
          start = text.index(marker)
          before = text[:start]
          section = text[start:]
          target = '  const provider = resolveProvider();'
          replacement = '  if (!ENV.groqApiKey) {\n    onError(new Error("GROQ_API_KEY is required for Virelle Assistant"));\n    return;\n  }\n  const provider = {\n    url: "https://api.groq.com/openai/v1/chat/completions",\n    apiKey: ENV.groqApiKey,\n    model: "llama-3.3-70b-versatile",\n  };'
          if target not in section:
              raise SystemExit('stream provider target missing')
          p.write_text(before + section.replace(target, replacement, 1))
          PY
          git config user.name "Virelle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add server/_core/llm.ts
          git commit -m "Route assistant streaming through Groq"
          git push
