name: Apply Sitewide Brand Consistency

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-sitewide-brand-consistency.mjs
      - .github/workflows/apply-sitewide-brand-consistency.yml
      - client/src/constants/siteBranding.ts
      - client/src/constants/siteBranding.test.ts
      - e2e/layout-integrity.spec.ts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sitewide-brand-icon-consistency-v4
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply deterministic source migration
        id: migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          migration = Path('scripts/apply-sitewide-brand-consistency.mjs')
          text = migration.read_text()
          text = text.replace(
              'if (!content.includes(before)) throw new Error(`Could not find ${label}`);',
              'if (!content.includes(before)) { console.warn(`Optional pattern not found: ${label}`); return content; }',
          )
          text = text.replace('${activeGroupLabel} workspace', '\\${activeGroupLabel} workspace')
          text = text.replace('${pageBrandGroup} workspace', '\\${pageBrandGroup} workspace')
          migration.write_text(text)
          PY
          set +e
          node scripts/apply-sitewide-brand-consistency.mjs > migration-diagnostics.txt 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python - <<'PY'
          from pathlib import Path

          funding = Path('client/src/pages/FundingCommandCentre.tsx')
          text = funding.read_text()
          if 'BookmarkCheck,' in text and '\n  Bookmark,' not in text:
              text = text.replace('  BookmarkCheck,', '  Bookmark,\n  BookmarkCheck,', 1)
          funding.write_text(text)

          branding = Path('client/src/constants/siteBranding.ts')
          text = branding.read_text()
          old = '''  const routeRule = SITE_BRAND_ROUTE_RULES.find(rule => rule.test.test(routeValue));
          if (routeRule) return { icon: routeRule.icon, group: routeRule.group, matchedBy: "route" };'''
          new = '''  const specialisedRule = SITE_BRAND_ROUTE_RULES.find(
            rule => rule.icon !== "projects" && rule.test.test(routeValue),
          );
          if (specialisedRule) {
            return { icon: specialisedRule.icon, group: specialisedRule.group, matchedBy: "route" };
          }
          const routeRule = SITE_BRAND_ROUTE_RULES.find(rule => rule.test.test(routeValue));
          if (routeRule) return { icon: routeRule.icon, group: routeRule.group, matchedBy: "route" };'''
          if old in text:
              text = text.replace(old, new)
          branding.write_text(text)
          PY
          fi
          cat migration-diagnostics.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-brand-migration-diagnostics
          path: migration-diagnostics.txt
          retention-days: 3
      - name: Stop on migration failure
        if: steps.migration.outputs.exit_code != '0'
        run: exit 1
      - name: Resolve Playwright dependency and lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/DashboardLayout.tsx client/src/pages/FundingCommandCentre.tsx client/src/constants/siteBranding.ts client/src/index.css package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Complete site-wide Virelle branding and route resolution"
          git push origin HEAD:feature/sitewide-brand-icon-consistency-v4
