name: Apply Sitewide Brand Consistency

on:
  push:
    branches:
      - feature/sitewide-brand-icon-consistency-v4
    paths:
      - scripts/apply-sitewide-brand-consistency.mjs
      - .github/workflows/apply-sitewide-brand-consistency.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-sitewide-brand-consistency.mjs
      - .github/workflows/apply-sitewide-brand-consistency.yml
      - client/src/constants/siteBranding.ts
      - client/src/constants/siteBranding.test.ts
      - e2e/layout-integrity.spec.ts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sitewide-brand-icon-consistency-v4
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply deterministic source migration
        id: migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-sitewide-brand-consistency.mjs')
          text = path.read_text()
          text = text.replace(
              'if (!content.includes(before)) throw new Error(`Could not find ${label}`);',
              'if (!content.includes(before)) { console.warn(`Optional pattern not found: ${label}`); return content; }',
          )
          path.write_text(text)
          PY
          set +e
          node scripts/apply-sitewide-brand-consistency.mjs > migration-diagnostics.txt 2>&1
          code=$?
          cat migration-diagnostics.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-brand-migration-diagnostics
          path: migration-diagnostics.txt
          retention-days: 3
      - name: Stop on migration failure
        if: steps.migration.outputs.exit_code != '0'
        run: exit 1
      - name: Resolve Playwright dependency and lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/DashboardLayout.tsx client/src/pages/FundingCommandCentre.tsx client/src/index.css package.json pnpm-lock.yaml .github/workflows/ci.yml
          git commit -m "Apply site-wide Virelle branding and responsive layout guards"
          git push origin HEAD:feature/sitewide-brand-icon-consistency-v4
