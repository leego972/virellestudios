name: Apply Adult Studio Landing Final Audit

on:
  push:
    branches:
      - feature/adult-entry-and-landing-overhaul
    paths:
      - .github/workflows/apply-adult-landing-final-audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adult-entry-and-landing-overhaul
          fetch-depth: 0

      - name: Apply final audit fixes
        run: python scripts/apply_adult_landing_final_audit.py

      - name: Remove one-shot automation files
        run: |
          git rm scripts/apply_adult_landing_final_audit.py
          git rm .github/workflows/apply-adult-landing-final-audit.yml

      - name: Commit implementation
        run: |
          git config user.name "Virelle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete Adult Studio and landing audit"
          git push origin HEAD:feature/adult-entry-and-landing-overhaul
