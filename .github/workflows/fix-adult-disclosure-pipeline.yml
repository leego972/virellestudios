name: Fix Adult Studio Disclosure Pipeline

on:
  push:
    branches:
      - feature/adult-entry-and-landing-overhaul
    paths:
      - .github/workflows/fix-adult-disclosure-pipeline.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adult-entry-and-landing-overhaul
          fetch-depth: 0
      - run: python scripts/fix-adult-disclosure-pipeline.py
      - run: |
          git rm scripts/fix-adult-disclosure-pipeline.py
          git rm .github/workflows/fix-adult-disclosure-pipeline.yml
      - run: |
          git config user.name "Virelle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Adult Studio disclaimer video pipeline"
          git push origin HEAD:feature/adult-entry-and-landing-overhaul
