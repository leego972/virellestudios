name: Update PostCSS Lockfile

on:
  push:
    branches:
      - lamalo-clothing-pipeline
    paths:
      - package.json
      - .github/workflows/update-postcss-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lamalo-clothing-pipeline
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile with patched PostCSS
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Confirm patched dependency tree
        run: |
          pnpm audit --audit-level moderate
          pnpm why postcss
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Update lockfile for patched PostCSS"
          git push origin HEAD:lamalo-clothing-pipeline
