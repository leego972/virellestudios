name: Apply Adult Studio Audio Completion

on:
  push:
    branches:
      - feature/adult-entry-and-landing-overhaul
    paths:
      - .github/workflows/apply-adult-audio-completion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adult-entry-and-landing-overhaul
          fetch-depth: 0
      - run: python scripts/apply_adult_audio_completion.py
      - run: |
          git rm scripts/apply_adult_audio_completion.py
          git rm .github/workflows/apply-adult-audio-completion.yml
      - run: |
          git config user.name "Virelle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Generate Adult Studio soundtrack when provider output is silent"
          git push origin HEAD:feature/adult-entry-and-landing-overhaul
