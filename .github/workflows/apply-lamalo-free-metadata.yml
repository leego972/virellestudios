name: Apply Lamalo Free Pipeline Metadata

on:
  push:
    branches:
      - lamalo-free-360-pipeline
    paths:
      - scripts/lamalo360/free/apply-free-metadata.mjs
      - .github/workflows/apply-lamalo-free-metadata.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lamalo-free-360-pipeline
          fetch-depth: 0
      - name: Apply metadata migration
        run: node scripts/lamalo360/free/apply-free-metadata.mjs
      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lamalo360/catalogue.mjs docs/lamalo-clothing-360-production.json
          git commit -m "Record free Lamalo 360 provider metadata"
          git push origin HEAD:lamalo-free-360-pipeline
