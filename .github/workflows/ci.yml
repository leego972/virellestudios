name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run TypeScript check
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm check 2>&1 | tee typecheck-errors.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: typecheck-errors.txt
          retention-days: 3
      - name: Fail when TypeScript check failed
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit and integration tests
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee test-errors.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-errors.txt
          retention-days: 3
      - name: Fail when tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_ID: ci-stub
          VITE_SENTRY_DSN: ""

  e2e:
    name: Responsive UI and E2E Audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium --with-deps
      - name: Build local production UI
        if: vars.E2E_BASE_URL == ''
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_ID: ci-layout-audit
          VITE_SENTRY_DSN: ""
      - name: Start local production preview
        if: vars.E2E_BASE_URL == ''
        shell: bash
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/virelle-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/welcome > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/virelle-preview.log
          exit 1
      - name: Run responsive layout and smoke tests
        shell: bash
        run: |
          export E2E_BASE_URL="${E2E_BASE_URL_OVERRIDE:-http://127.0.0.1:4173}"
          pnpm exec playwright test e2e/layout-integrity.spec.ts e2e/smoke.spec.ts
        env:
          E2E_BASE_URL_OVERRIDE: ${{ vars.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - name: Upload visual audit results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ui-audit
          path: |
            playwright-report/
            test-results/
            /tmp/virelle-preview.log
          if-no-files-found: ignore
          retention-days: 7
