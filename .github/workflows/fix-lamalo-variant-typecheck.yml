name: Fix Lamalo Variant Typecheck

on:
  push:
    branches:
      - feature/lamalo-master-360-variants
    paths:
      - scripts/fix-lamalo-variant-typecheck.mjs
      - .github/workflows/fix-lamalo-variant-typecheck.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lamalo-master-360-variants
          fetch-depth: 0
      - name: Apply fix
        run: node scripts/fix-lamalo-variant-typecheck.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/WardrobeMarketplacePage.tsx
          git commit -m "Fix Lamalo colour swatch typecheck"
          git push origin HEAD:feature/lamalo-master-360-variants
