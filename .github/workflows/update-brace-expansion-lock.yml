name: Update brace-expansion Lockfile

on:
  push:
    branches:
      - lamalo-free-360-pipeline
    paths:
      - package.json
      - .github/workflows/update-brace-expansion-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lamalo-free-360-pipeline
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Update lockfile for patched brace-expansion"
          git push origin HEAD:lamalo-free-360-pipeline
