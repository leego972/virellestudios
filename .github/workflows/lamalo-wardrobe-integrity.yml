name: Lamalo wardrobe integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "server/_core/wardrobePurchaseInventory.ts"
      - "server/_core/wardrobePurchaseFulfillment.ts"
      - "server/_core/wardrobeInventoryService.ts"
      - "server/_core/wardrobeContinuity.ts"
      - "server/_core/sceneGenerationContext.ts"
      - "server/_core/extendedSceneGenerator.ts"
      - "server/_core/videoQualityGate.ts"
      - "server/_core/lamaloCatalogIntegrity.ts"
      - "server/_core/lamaloWelcomeInventory.ts"
      - "server/lamalo-gifts-router.ts"
      - "server/lamalo-seed.ts"
      - "client/src/components/WelcomeOutfitPicker.tsx"
      - "client/src/pages/Home.tsx"
      - "scripts/check-lamalo-welcome-contract.mjs"
      - "scripts/finalize-lamalo-master-variants.mjs"
      - "server/wardrobePurchaseFulfillment.test.ts"
      - "server/wardrobeContinuity.test.ts"
      - "server/sceneWardrobeContinuity.test.ts"
      - ".github/workflows/lamalo-wardrobe-integrity.yml"
  push:
    branches: [main]
    paths:
      - "server/_core/wardrobePurchaseInventory.ts"
      - "server/_core/wardrobePurchaseFulfillment.ts"
      - "server/_core/wardrobeInventoryService.ts"
      - "server/_core/wardrobeContinuity.ts"
      - "server/_core/sceneGenerationContext.ts"
      - "server/_core/extendedSceneGenerator.ts"
      - "server/_core/videoQualityGate.ts"
      - "server/_core/lamaloCatalogIntegrity.ts"
      - "server/_core/lamaloWelcomeInventory.ts"
      - "server/lamalo-gifts-router.ts"
      - "server/lamalo-seed.ts"
      - "client/src/components/WelcomeOutfitPicker.tsx"
      - "client/src/pages/Home.tsx"
      - "scripts/check-lamalo-welcome-contract.mjs"
      - "server/wardrobePurchaseFulfillment.test.ts"
      - "server/wardrobeContinuity.test.ts"
      - "server/sceneWardrobeContinuity.test.ts"
      - ".github/workflows/lamalo-wardrobe-integrity.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lamalo-master-360-variants
          fetch-depth: 0
      - name: Apply pending Lamalo source cleanup
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          node scripts/finalize-lamalo-master-variants.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/WardrobeMarketplacePage.tsx server/lamalo-seed.ts server/_core/wardrobeContinuity.ts
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Lamalo colour SKU presentation"
            git push origin HEAD:refs/heads/feature/lamalo-master-360-variants
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lamalo welcome contract
        run: node scripts/check-lamalo-welcome-contract.mjs
      - name: TypeScript check
        run: pnpm check
      - name: Wardrobe regression tests
        run: pnpm vitest run server/wardrobePurchaseFulfillment.test.ts server/wardrobeContinuity.test.ts server/sceneWardrobeContinuity.test.ts
