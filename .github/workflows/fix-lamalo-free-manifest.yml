name: Fix Lamalo Free Manifest Contract

on:
  push:
    branches:
      - lamalo-free-360-pipeline
    paths:
      - scripts/lamalo360/free/fix-free-manifest-contract.mjs
      - .github/workflows/fix-lamalo-free-manifest.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lamalo-free-360-pipeline
          fetch-depth: 0
      - run: node scripts/lamalo360/free/fix-free-manifest-contract.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lamalo360/catalogue.mjs
          git commit -m "Align free Lamalo manifest compiler metadata"
          git push origin HEAD:lamalo-free-360-pipeline
