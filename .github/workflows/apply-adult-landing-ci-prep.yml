name: Apply Adult Studio Landing CI Prep

on:
  push:
    branches:
      - feature/adult-entry-and-landing-overhaul
    paths:
      - .github/workflows/apply-adult-landing-ci-prep.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adult-entry-and-landing-overhaul
          fetch-depth: 0

      - run: python scripts/apply_adult_landing_ci_prep.py

      - run: |
          git rm scripts/apply_adult_landing_ci_prep.py
          git rm .github/workflows/apply-adult-landing-ci-prep.yml

      - run: |
          git config user.name "Virelle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Adult Studio overhaul for CI"
          git push origin HEAD:feature/adult-entry-and-landing-overhaul
