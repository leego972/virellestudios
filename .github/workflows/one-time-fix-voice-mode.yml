name: One-time voice mode reliability repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-fix-voice-mode.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch voice mode auto-submit and timeout
        shell: python
        run: |
          from pathlib import Path
          p = Path('client/src/components/DirectorChat.tsx')
          s = p.read_text()

          s = s.replace(
            '  const vadSilenceTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);\n  const vadHasSpokenRef',
            '  const vadSilenceTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);\n  const vadHardStopTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);\n  const vadHasSpokenRef'
          )

          s = s.replace(
            '      if (vadSilenceTimerRef.current) clearTimeout(vadSilenceTimerRef.current);\n      if (streamRef.current)',
            '      if (vadSilenceTimerRef.current) clearTimeout(vadSilenceTimerRef.current);\n      if (vadHardStopTimerRef.current) clearTimeout(vadHardStopTimerRef.current);\n      if (streamRef.current)'
          )

          s = s.replace(
            '          if (vadSilenceTimerRef.current) { clearTimeout(vadSilenceTimerRef.current); vadSilenceTimerRef.current = null; }\n          if (vmRecordingTimerRef.current)',
            '          if (vadSilenceTimerRef.current) { clearTimeout(vadSilenceTimerRef.current); vadSilenceTimerRef.current = null; }\n          if (vadHardStopTimerRef.current) { clearTimeout(vadHardStopTimerRef.current); vadHardStopTimerRef.current = null; }\n          if (vmRecordingTimerRef.current)',
            1
          )

          s = s.replace(
            '              if (text.trim()) {\n                webSpeechTextRef.current = (webSpeechTextRef.current + " " + text).trim();\n              }',
            '              if (text.trim()) {\n                webSpeechTextRef.current = (webSpeechTextRef.current + " " + text).trim();\n                // iOS Web Speech can produce a final transcript even when analyser-based\n                // silence detection is unreliable. Submit shortly after the final phrase.\n                if (vadSilenceTimerRef.current) clearTimeout(vadSilenceTimerRef.current);\n                vadSilenceTimerRef.current = setTimeout(() => {\n                  const activeRecorder = voiceModeRecorderRef.current;\n                  if (voiceModeRef.current && activeRecorder && activeRecorder.state !== "inactive") {\n                    setVoiceModeState("thinking");\n                    voiceModeStateRef.current = "thinking";\n                    try { activeRecorder.requestData(); } catch {}\n                    try { activeRecorder.stop(); } catch {}\n                  }\n                }, 900);\n              }'
          )

          s = s.replace(
            '          const SILENCE_THRESHOLD = 12;  // RMS below this = silence\n          const SILENCE_DURATION = 1500;',
            '          const SILENCE_THRESHOLD = 2.2; // mobile microphones commonly report low RMS\n          const SILENCE_DURATION = 1100;'
          )

          s = s.replace(
            '        recorder.start(250);\n        setVoiceModeState("listening");',
            '        recorder.start(250);\n        // Never leave voice mode listening forever. This also guarantees a\n        // Whisper fallback on browsers where Web Speech or VAD is unreliable.\n        if (vadHardStopTimerRef.current) clearTimeout(vadHardStopTimerRef.current);\n        vadHardStopTimerRef.current = setTimeout(() => {\n          const activeRecorder = voiceModeRecorderRef.current;\n          if (voiceModeRef.current && activeRecorder && activeRecorder.state !== "inactive") {\n            setVoiceModeState("thinking");\n            voiceModeStateRef.current = "thinking";\n            try { activeRecorder.requestData(); } catch {}\n            try { activeRecorder.stop(); } catch {}\n          }\n        }, 20000);\n        setVoiceModeState("listening");'
          )

          s = s.replace(
            '    if (vadSilenceTimerRef.current) { clearTimeout(vadSilenceTimerRef.current); vadSilenceTimerRef.current = null; }\n    if (vmRecordingTimerRef.current)',
            '    if (vadSilenceTimerRef.current) { clearTimeout(vadSilenceTimerRef.current); vadSilenceTimerRef.current = null; }\n    if (vadHardStopTimerRef.current) { clearTimeout(vadHardStopTimerRef.current); vadHardStopTimerRef.current = null; }\n    if (vmRecordingTimerRef.current)'
          )

          if 'vadHardStopTimerRef' not in s or 'SILENCE_THRESHOLD = 2.2' not in s:
            raise SystemExit('Voice patch did not apply as expected')

          p.write_text(s)
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-fix-voice-mode.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/DirectorChat.tsx .github/workflows/one-time-fix-voice-mode.yml
          git commit -m "Fix voice mode auto-submit on mobile"
          git push