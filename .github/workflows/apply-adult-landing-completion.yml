name: Apply Adult Studio Landing Completion

on:
  push:
    branches:
      - feature/adult-entry-and-landing-overhaul
    paths:
      - .github/workflows/apply-adult-landing-completion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adult-entry-and-landing-overhaul
          fetch-depth: 0

      - name: Apply final product-boundary cleanup
        run: python scripts/apply_adult_landing_completion.py

      - name: Remove one-shot automation files
        run: |
          git rm scripts/apply_adult_landing_completion.py
          git rm .github/workflows/apply-adult-landing-completion.yml

      - name: Commit implementation
        run: |
          git config user.name "Virelle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finish Adult Studio product boundaries and landing content"
          git push origin HEAD:feature/adult-entry-and-landing-overhaul
