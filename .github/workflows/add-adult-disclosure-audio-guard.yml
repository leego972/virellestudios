name: Add Adult Studio Disclosure Audio Guard

on:
  push:
    branches:
      - feature/adult-entry-and-landing-overhaul
    paths:
      - .github/workflows/add-adult-disclosure-audio-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adult-entry-and-landing-overhaul
          fetch-depth: 0
      - run: python scripts/add-adult-disclosure-audio-guard.py
      - run: |
          git rm scripts/add-adult-disclosure-audio-guard.py
          git rm .github/workflows/add-adult-disclosure-audio-guard.yml
      - run: |
          git config user.name "Virelle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Handle silent Adult Studio video outputs"
          git push origin HEAD:feature/adult-entry-and-landing-overhaul
